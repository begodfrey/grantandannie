    :root {
      --paper: #fef7dd;
      --ink: #141210;
    }

    @property --wash {
      syntax: "<number>";
      inherits: true;
      initial-value: 0;
    }

    @property --sink {
      syntax: "<number>";
      inherits: true;
      initial-value: 0;
    }

    @property --stroke {
      syntax: "<length>";
      inherits: true;
      initial-value: 1.15px;
    }

    @property --bar-drop {
      syntax: "<length>";
      inherits: true;
      initial-value: 0.045em;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--paper);
      color: var(--ink);
      color-scheme: light;
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Cardo", "Palatino Linotype", Palatino, Georgia, serif;
      font-style: italic;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      opacity: 0;
    }

    html.ready body {
      opacity: 1;
    }

    ::selection {
      background: var(--ink);
      color: var(--paper);
    }


    .sheet {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(800px, 100%);
      margin-inline: auto;
      gap: clamp(5.5rem, 18vh, 11rem);
      padding: 18vh max(1.15rem, env(safe-area-inset-right)) 18vh max(1.15rem, env(safe-area-inset-left));
      text-align: center;
    }

    @media (max-width: 480px), (max-height: 500px) and (max-width: 950px) {
      .sheet {
        padding-top: 22vh;
        padding-bottom: 22vh;
        gap: calc(clamp(5.5rem, 18vh, 11rem) * 2 / 3);
      }
    }

    h1,
    p,
    nav,
    a {
      margin: 0;
    }

    h1,
    .invite {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.15rem, 3vh, 1.75rem);
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4.5rem, 16vh, 9rem);
    }

    @media (max-width: 480px), (max-height: 500px) and (max-width: 950px) {
      nav {
        gap: calc(clamp(4.5rem, 16vh, 9rem) * 0.5);
      }
    }

    .line {
      --expo: 0;
      --wash: 0;
      --sink: 0;
      --stroke: 1.2px;
      display: block;
      position: relative;
      font-weight: 400;
      font-style: italic;
      font-size: calc((min(100vw, 800px) - 2.8rem) / 13.55);
      line-height: 0.92;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--ink);
      color: color-mix(
        in srgb,
        var(--paper) calc(var(--wash) * 100%),
        var(--ink)
        /* color-mix(in srgb, #050403 calc(var(--sink) * 100%), var(--ink)) */
      );
      /* -webkit-text-stroke: calc(var(--sink) * 0.055em) var(--ink); */
      paint-order: stroke fill;
      text-shadow:
        0 0 calc(var(--wash) * 0.05em) var(--paper),
        0 0 calc(var(--wash) * 0.16em) var(--paper),
        0 0 calc(var(--wash) * 0.36em) var(--paper);
        /* 0 0 calc(var(--sink) * 0.012em) var(--ink),
        0 0 calc(var(--sink) * 0.04em) var(--ink),
        0 0 calc(var(--sink) * 0.09em) rgba(20, 18, 16, 0.9); */
    }

    .finger {
      font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols2", "DejaVu Sans", sans-serif;
      font-style: normal;
      font-weight: 400;
      font-synthesis: none;
      letter-spacing: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a.line::after,
    a .line::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + var(--bar-drop, 0.045em));
      height: var(--stroke);
      border-radius: 999px;
      background: currentColor;
      pointer-events: none;
    }

    a:focus-visible {
      outline: 1px solid currentColor;
      outline-offset: 8px;
    }

    @media (max-width: 640px) {
      .line {
        font-size: calc((100vw - 2.8rem) / 16.4);
      }
    }

    @media print {
      body { opacity: 1; }
      .sheet { padding: 8vh 1rem; }
    }
  </style>
  <noscript><style>body { opacity: 1; }</style></noscript>

    (function () {
      var lines = [].slice.call(document.querySelectorAll(".line"));

      function measureHeavy() {
        heavy = lines.map(function (el) {

        for (var h = 0; h < lines.length; h++) {

        el.style.removeProperty("--sink");
        el.style.removeProperty("--stroke");

      function bottomFade(rise) {
        if (rise <= 0) return 0;
        var x = Math.min(1, rise / 0.92);
        return Math.pow(x, 1.35);

      function barStroke(expo, index) {
        if (expo >= 0) {
          return 1.15 + (0.1 - 1.15) * bottomFade(expo / 100);
        }
        var drop = Math.max(0, -expo) / 100;
        var heavyPx = heavy[index] || 8;
        var heft = Math.pow(drop, 1.15);
        return 1.15 + (heavyPx - 1.15) * heft;
      }

          // wash = 0;
        }
        // Cardo italic is one book weight, so the entrance does not change the face.
        // el.style.fontVariationSettings = '"EXPO" ' + weightExpo.toFixed(2);
        el.style.setProperty("--expo", weightExpo.toFixed(2));
        el.style.setProperty("--wash", wash.toFixed(4));
        el.style.setProperty("--sink", sink.toFixed(4));
        if (!el.classList.contains("is-underline")) {
          el.style.setProperty("--stroke", stroke.toFixed(3) + "px");
        }
      }

      function expoAt(el) {
        var vh = window.innerHeight;
        if (vh < 1) return 0;
        var rect = el.getBoundingClientRect();
        var y = rect.top + rect.height / 2;
        var p = y / vh;
        if (p < 0) p = 0;
        if (p > 1) p = 1;
        if (p <= 0.25) return 100 - (p / 0.25) * 200;
        if (p <= 0.5) return -100 + ((p - 0.25) / 0.25) * 100;
        return ((p - 0.5) / 0.5) * 100;
      }

      function apply() {
        // Scroll weight is parked. After the intro, every line stays at the regular cut.
        // for (var i = 0; i < lines.length; i++) {
        //   if (lines[i].classList.contains("is-intro")) continue;
        //   paint(lines[i], expoAt(lines[i]), i);
        // }
      }

      var queued = false;
      function kick() {
        if (queued) return;
        queued = true;
        requestAnimationFrame(function () {
          queued = false;
          apply();
        });
      }

      var introStarted = false;
      var fontsReady = false;

      function relayout() {
        centerTitle();
        measureHeavy();
        if (!fontsReady) return;
        if (!introStarted) {
          introStarted = true;
          runIntro();
          return;
        }
        // apply();
      }

      var hoverFrame = new WeakMap();

      function smooth(t) {
        return t * t * (3 - 2 * t);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function easeOut(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function runIntro() {
        var stagger = 200;
        var dur = 1700;
        var started = performance.now();
        var t0 = started;
        for (var i = 0; i < lines.length; i++) {
          lines[i].classList.add("is-intro");
          paint(lines[i], 100, i);
        }
        document.documentElement.classList.add("ready");

        function frame(now) {
          var pending = false;
          for (var n = 0; n < lines.length; n++) {
            var el = lines[n];
            if (!el.classList.contains("is-intro")) continue;
            var local = (now - t0 - n * stagger) / dur;
            // var target = expoAt(el);
            var target = 0;
            if (local <= 0) {
              pending = true;
              paint(el, 100, n);
            } else if (local >= 1) {
              el.classList.remove("is-intro");
              paint(el, target, n);
            } else {
              pending = true;
              paint(el, lerp(100, target, easeOut(local)), n);
            }
          }
          if (pending) requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      function playLink(link, opening) {
        var items = link.classList.contains("line") ? [link] : [].slice.call(link.querySelectorAll(".line"));
        if (!items.length) return;
        var running = hoverFrame.get(link);
        if (running) cancelAnimationFrame(running);
        var states = items.map(function (el) {
          var strokeNow = parseFloat(el.style.getPropertyValue("--stroke"));
          var dropRaw = el.style.getPropertyValue("--bar-drop");
          var dropNow = parseFloat(dropRaw);
          if (!isFinite(strokeNow)) strokeNow = 1.15;
          if (!dropRaw || !isFinite(dropNow)) dropNow = 0.045;
          // var expo = expoAt(el);
          // var restStroke = barStroke(expo, lines.indexOf(el));
          var restStroke = 1.15;
          return {
            el: el,
            fromStroke: strokeNow,
            fromDrop: dropNow,
            toStroke: opening ? restStroke + 2.2 : restStroke,
            toDrop: opening ? 0.16 : 0.045
          };
        });
        items.forEach(function (el) { el.classList.add("is-underline"); });
        var start = performance.now();
        var dur = 160;

        function frame(now) {
          var t = (now - start) / dur;
          if (t > 1) t = 1;
          var u = smooth(t);
          for (var n = 0; n < states.length; n++) {
            var s = states[n];
            s.el.style.setProperty("--stroke", lerp(s.fromStroke, s.toStroke, u).toFixed(3) + "px");
            s.el.style.setProperty("--bar-drop", lerp(s.fromDrop, s.toDrop, u).toFixed(4) + "em");
          }
          if (t < 1) {
            hoverFrame.set(link, requestAnimationFrame(frame));
          } else {
            hoverFrame.delete(link);
            if (!opening) {
              items.forEach(function (el) {
                el.classList.remove("is-underline");
                el.style.removeProperty("--bar-drop");
              });
              // apply();
            }
          }
        }

        hoverFrame.set(link, requestAnimationFrame(frame));
      }

      [].slice.call(document.querySelectorAll("nav a")).forEach(function (link) {
        link.addEventListener("mouseenter", function () { playLink(link, true); });
        link.addEventListener("mouseleave", function () { playLink(link, false); });
      });

      // window.addEventListener("scroll", kick, { passive: true });
      window.addEventListener("resize", relayout);
      function begin() {
        if (fontsReady) return;
        fontsReady = true;
        relayout();
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(begin);
      else begin();
      setTimeout(begin, 2500);
    })();
  </script>

      if ('group' in window.console) {
        console.groupCollapsed('👁🚫💻 - I Hate Websites - http://www.ihatewebsites.com')
        console.info('Does a sandwich artist love sandwiches?')
        console.groupEnd()
      } else {
        console.info('👁🚫💻 - I Hate Websites - http://www.ihatewebsites.com')
      }
    }
  </script>
